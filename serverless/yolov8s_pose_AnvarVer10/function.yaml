spec:
  description: yolov8s_pose_AnvarVer10
  runtime: 'python:3.10'
  handler: main:handler
  eventTimeout: 30s

  build:
    image: yolov8s-pose-anvarver10
    baseImage: ubuntu:22.04

    directives:
      preCopy:
        - kind: ENV
          value: DEBIAN_FRONTEND=noninteractive
        - kind: ENV
          value: MODEL_PATH=yolov8s_pose_AnvarVer10.pt
        - kind: ENV
          value: DETECTION_THRESHOLD=0.5
        - kind: ENV
          value: KEYPOINT_THRESHOLD=0.3
        - kind: RUN
          value: apt-get update && apt-get -y install curl git python3 python3-pip
        - kind: RUN
          value: apt-get -y install libgl1-mesa-glx libglib2.0-dev
        - kind: WORKDIR
          value: /opt/nuclio
        - kind: RUN
          value: pip3 install --no-cache-dir torch==2.0.0+cpu torchvision==0.15.1+cpu --extra-index-url https://download.pytorch.org/whl/cpu
        - kind: RUN
          value: pip3 install --no-cache-dir 'ultralytics>=8.3.0,<9.0.0' opencv-python-headless==4.7.0.72 numpy==1.24.3 pyyaml==6.0.1
        - kind: RUN
          value: ln -s /usr/bin/pip3 /usr/local/bin/pip
        - kind: RUN
          value: ln -s /usr/bin/python3 /usr/local/bin/python

  triggers:
    myHttpTrigger:
      maxWorkers: 1
      kind: 'http'
      workerAvailabilityTimeoutMilliseconds: 10000
      attributes:
        maxRequestBodySize: 33554432 # 32MB

  platform:
    attributes:
      restartPolicy:
        name: always
        maximumRetryCount: 3
      mountMode: volume
